<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>mktbox store image</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1280px; height: 800px; overflow: hidden; background: #f4f3ef; color: #141413; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; display: flex; align-items: center; gap: 72px; padding: 0 96px; position: relative; }
  .copy { flex: 1; display: grid; gap: 22px; }
  .logo { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 26px; letter-spacing: -0.02em; }
  .logo svg { width: 28px; height: 28px; }
  h1 { font-size: 58px; line-height: 1.02; letter-spacing: -0.045em; }
  p { font-size: 22px; line-height: 1.45; color: #5f5d57; max-width: 520px; }
  .shot { width: 360px; height: 560px; transform: scale(1.3); transform-origin: center; border-radius: 22px; overflow: hidden; box-shadow: 0 40px 80px -30px rgba(20,20,19,.35), 0 0 0 1px rgba(20,20,19,.08); background: #f4f3ef; flex: none; margin-right: 50px; }
  iframe { width: 360px; height: 560px; border: 0; display: block; }
  .mark { position: absolute; left: -70px; bottom: -70px; display: flex; flex-wrap: wrap; width: 220px; gap: 16px; opacity: .9; }
  .mark i { width: 102px; height: 102px; border-radius: 28px; background: #e6e4de; }
  .mark i:nth-child(2) { background: #e8e8fb; }
  /* small promo tile */
  body.tile { width: 440px; height: 280px; padding: 0 34px; gap: 0; }
  body.tile .shot, body.tile p { display: none; }
  body.tile h1 { font-size: 32px; max-width: 250px; }
  body.tile .logo { font-size: 20px; }
  body.tile .logo svg { width: 22px; height: 22px; }
  body.tile .mark { left: auto; right: -34px; top: 50%; bottom: auto; transform: translateY(-50%); width: 160px; gap: 12px; }
  body.tile .mark i { width: 74px; height: 74px; border-radius: 20px; }
  body.tile .mark i:nth-child(2) { background: #6c70e0; }
</style>
</head>
<body>
  <div class="mark"><i></i><i></i><i></i><i></i></div>
  <div class="copy">
    <div class="logo">
      <svg viewBox="0 0 32 32"><rect x="3" y="3" width="12" height="12" rx="3.5" fill="#141413"/><rect x="17" y="3" width="12" height="12" rx="3.5" fill="#6c70e0"/><rect x="3" y="17" width="12" height="12" rx="3.5" fill="#141413"/><rect x="17" y="17" width="12" height="12" rx="3.5" fill="#141413"/></svg>
      mktbox
    </div>
    <h1 id="h"></h1>
    <p id="p"></p>
  </div>
  <div class="shot"><iframe id="f"></iframe></div>
  <script>
    const v = new URLSearchParams(location.search).get("v") || "qr";
    const copy = {
      qr: ["A QR code for any page, in one click", "Styled, free and never expires. Download it as a PNG, or open it in the full QR generator to customize."],
      utm: ["Tagged links without the spreadsheet", "Pick where you're sharing, name the campaign, copy. The same values as the free mktbox UTM builder."],
      check: ["Check a page before you share it", "Link preview, speed audit, vibe code audit and headline score. Right-click any link, image or text for more."],
      tile: ["Free marketing tools on every page", ""],
    }[v];
    document.getElementById("h").textContent = copy[0];
    document.getElementById("p").textContent = copy[1];
    if (v === "tile") document.body.classList.add("tile");
    localStorage.setItem("tab", v === "tile" ? "qr" : v);
    localStorage.setItem("channel", "linkedin");
    localStorage.setItem("campaign", "spring_launch");
    document.getElementById("f").src = "../popup.html?url=" + encodeURIComponent("https://mktbox.xyz/blog/wifi-qr-code") + "&title=" + encodeURIComponent("How to make a QR code for your wifi password");
  </script>
</body>
</html>
